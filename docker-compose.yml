# APEX AI Engine — local stack aligned to Garcar APEX build guide
# Services: db, redis, api, worker-scout, worker-analyst, worker-executor, worker-monetizer
# Note: prior web/worker/beat/flower layout replaced; Celery beat can be re-added later if needed.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex}
      POSTGRES_DB: ${POSTGRES_DB:-apex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn apex.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/apex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker-scout:
    build: .
    command: python -m apex.workers.scout
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/apex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'apex.workers.scout' >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  worker-analyst:
    build: .
    command: python -m apex.workers.analyst
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/apex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'apex.workers.analyst' >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  worker-executor:
    build: .
    command: python -m apex.workers.executor
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/apex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'apex.workers.executor' >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  worker-monetizer:
    build: .
    command: python -m apex.workers.monetizer
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/apex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'apex.workers.monetizer' >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  apex-net:
    driver: bridge
